<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="otosu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>otosu</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" type="image/x-icon" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
      /* 連打で拡大・長押しで文字選択・タップの灰色の光が出ないように */
      body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* UI の色と文字（D45）。白黒だけ（D37）で、明るさの段で区別する */
      :root {
        --ui-rgb: 232, 236, 242;
        --ui-strong: #fff;
        --ui-text: rgba(var(--ui-rgb), 0.82);
        --ui-dim: rgba(var(--ui-rgb), 0.45);
        --ui-faint: rgba(var(--ui-rgb), 0.28);
        --ui-line: rgba(255, 255, 255, 0.08);
        --ui-bg: rgba(0, 0, 0, 0.66);
        --ui-radius: 12px;
        --fs: 11.5px;
        --fs-s: 10.5px;
        --fs-l: 13px;
      }
      body { font-family: ui-sans-serif, system-ui, sans-serif; color: rgb(var(--ui-rgb)); }
      body.idle, body.idle canvas { cursor: none; }
      canvas { display: block; cursor: crosshair; touch-action: none; }
      #overlay {
        position: fixed; inset: 0; display: grid; place-items: center;
        z-index: 30; background: #000; cursor: pointer; letter-spacing: 0.3em; font-size: 14px;
        user-select: none;
      }
      #overlay b { display: block; font-size: 40px; font-weight: 300; letter-spacing: 0.4em; margin-bottom: 16px; }
      /* 何をするものかを一行で（D71）。名前だけでは伝わらない */
      #overlay p { margin: 0 0 32px; font-size: 12px; letter-spacing: 0.12em; opacity: 0.6; }
      /* 押すとすぐ玉が落ちて鳴るので、先に音量を下げてもらう。真ん中の名前と説明から離して、画面の下に置く（D71） */
      #overlay small {
        position: absolute; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom));
        font-size: 11px; letter-spacing: 0.2em; opacity: 0.45;
      }
      /* ---- UI（D24）: 操作が止まると消える。H で完全に隠す。ツールバーの見た目は src/ui/toolbar.css ---- */
      .ui { transition: opacity 0.5s; }
      body.idle .ui:not(:hover):not(.pn) { opacity: 0; pointer-events: none; }
      body.ui-hidden .ui { display: none !important; }
      .tap { display: none; }
      @media (hover: none) {
        .click { display: none; }
        .tap { display: inline; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <a id="source-link" class="ui" href="https://github.com/shunyakoide/otosu" target="_blank" rel="noopener" title="open the code on GitHub">github</a>
    <div id="overlay" role="button" tabindex="0"><div style="text-align:center"><b>otosu</b><p>draw lines — falling balls turn them into music</p><span class="click">click</span><span class="tap">tap</span> to start<small>sound plays right away — mind your volume</small></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
